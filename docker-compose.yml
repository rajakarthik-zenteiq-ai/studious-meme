services:
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS:-password}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  milvus:
    image: milvusdb/milvus:v2.3.4
    container_name: milvus
    depends_on:
      - etcd
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - COMMON_STORAGETYPE=local
    ports:
      - "19531:19530"
      - "9092:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["milvus", "run", "standalone"]

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  # ── MCP Server Services ────────────────────────────────────────────
  mongo_server:
    build: 
      context: .
      dockerfile: mcp_servers/mongo_server/Dockerfile
    container_name: mongo_server
    ports:
      - "8100:8100"
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - PYTHONUNBUFFERED=1
      # Required by config validation inside container
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URI=mongodb://admin:password@mongo:27017/logsdb?authSource=admin
      # Service-specific
      - MONGO_DB=logsdb
      - MONGO_MAX_POOL_SIZE=${MONGO_MAX_POOL_SIZE:-10}
      - MONGO_MIN_POOL_SIZE=${MONGO_MIN_POOL_SIZE:-1}
      - DEBUG=${DEBUG:-true}
      - MONGO_MCP_PORT=8100
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - SCIREX_DATA_DIR=/data/user_datasets
      - SCIREX_MODEL_DIR=/data/user_models
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./data_cache:/app/data
      - scirex_data:/data
    command: ["python", "/app/server.py", "--host", "0.0.0.0", "--port", "8100"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/mcp/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

  milvus_server:
    build:
      context: .
      dockerfile: mcp_servers/milvus_server/Dockerfile
    container_name: milvus_server
    ports:
      - "8110:8110"
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - PYTHONUNBUFFERED=1
      # Required by config validation inside container
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URI=mongodb://admin:password@mongo:27017/logsdb?authSource=admin
      # Milvus specific
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_COLLECTION=${MILVUS_COLLECTION:-logs_embeddings}
      - MILVUS_MCP_PORT=8110
      - DEBUG=${DEBUG:-true}
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8110/mcp/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

  websearch_server:
    build:
      context: .
      dockerfile: mcp_servers/websearch_server/Dockerfile
    container_name: websearch_server
    ports:
      - "8140:8140"
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - PYTHONUNBUFFERED=1
      # Required by config validation inside container
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URI=mongodb://admin:password@mongo:27017/logsdb?authSource=admin
      # Service specific
      - SEARCH_MODEL=${SEARCH_MODEL:-gpt-4o-mini}
      - WEBSEARCH_MCP_PORT=8140
      - DEBUG=${DEBUG:-true}
    command: ["python", "/app/server.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8140/mcp/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

  scirex_server:
    build:
      context: .
      dockerfile: mcp_servers/scirex_server/Dockerfile
    container_name: scirex_server
    ports:
      - "8150:8150"
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - PYTHONUNBUFFERED=1
      # Required by config validation inside container
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URI=mongodb://admin:password@mongo:27017/logsdb?authSource=admin
      # Service specific
      - SCIREX_DATA_DIR=/data/user_datasets
      - SCIREX_MODEL_DIR=/data/user_models
      - SCIREX_MCP_PORT=8150
      - DEBUG=${DEBUG:-true}
    volumes:
      - scirex_data:/data
    depends_on:
      - mongo_server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8150/mcp/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo_data:
  redis_data:
  etcd_data:
  milvus_data:
  scirex_data:

networks:
  default:
    name: mcp_network