[project]
name = "mcp_log_analysis"
version = "0.1.0"
description = "MCP Log Analysis platform with LangGraph agent, MCP servers, and RBAC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Web / API
    "fastapi>=0.115.0,<0.117.0",
    "uvicorn[standard]>=0.30.0,<0.32.0",
    "sse-starlette>=2.0.0,<3.0.0",
    "httpx>=0.28.1,<0.30.0",
    "aiohttp>=3.9.0,<3.11.0",
    "aiofiles>=23.2.0,<24.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    
    # Datastores / Drivers
    "pymongo>=4.6.0,<5.0.0",
    "motor>=3.4.0,<4.0.0",
    "redis>=5.0.0,<6.0.0",
    "aioredis>=2.0.0,<3.0.0",
    "pymilvus>=2.4.0,<2.6.0",
    "neo4j>=5.20.0,<6.0.0",
    "boto3>=1.35.0,<2.0.0",

    # Core MCP + adapters
    "mcp[cli]>=1.10.0,<2.0.0",
    "fastapi-mcp>=0.3.6,<0.4.0",
    "fastmcp==2.10.5",
    "langchain-core>=0.3.36,<0.4.0",
    "langchain>=0.3.0,<0.4.0",
    "langchain-openai>=0.3.0,<0.4.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langgraph==0.2.28",
    "langchain-mcp-adapters==0.1.9",
    
    # LLM Providers / Extensions
    "openai>=1.30.0,<2.0.0",
    "langchain-google-genai>=2.0.0,<3.0.0",

    # Data / ML
    "numpy>=1.26.0,<2.2.0",
    "pandas>=2.2.0,<3.0.0",
    "scikit-learn>=1.4.0,<1.6.0",
    "joblib>=1.3.0,<2.0.0",

    # Auth / Security
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "authlib>=1.3.0,<2.0.0",
    "cryptography>=42.0.0,<43.0.0",

    # Utilities
    "requests>=2.31.0,<3.0.0",
    "python-dateutil>=2.8.0,<3.0.0",
    "rich>=13.0.0,<14.0.0",
    "typer>=0.12.0,<0.13.0",
    "click>=8.1.0,<9.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "streamlit>=1.32.0,<2.0.0",
    # Optional caching layer
    "lmcache>=0.1.0,<0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "black>=24.0.0,<25.0.0",
    "flake8>=7.0.0,<8.0.0",
    "mypy>=1.8.0,<2.0.0",
    "isort>=5.13.0,<6.0.0",
]
